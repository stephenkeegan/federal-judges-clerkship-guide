[project]
name = "federal-judges-clerkship-map"
version = "0.1.0"
description = "Pipeline that maps federal judges (circuit/district), their courthouses, clerk-relevant info, and OSCAR clerkship hiring status."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "folium>=0.15",
    "numpy>=1.24",
    "wikipedia>=1.4",
    "lxml>=5.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
judges-pipeline = "run_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "run_pipeline",
    "helper_functions",
    "parse_oscar",
    "oscar_scraper",
    "enrich_judges",
    "make_map",
    "add_info",
    "merge",
    "current_circuit_judges",
    "current_district_judges",
    "pres_appoints",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]