name: Daily update

on:
  schedule:
    # Every day at 7:00 AM UTC (2:00 AM ET / 11:00 PM PT previous day).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run daily update
        run: python daily_update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit regenerated source data and outputs so the Pages deploy is current.
          git add current_circuit_judges.csv current_district_judges.csv \
                  pres_appeals.csv pres_district.csv \
                  final_district.csv final_appeals.csv \
                  final_district_enriched.csv final_appeals_enriched.csv \
                  oscar_clerkship_map.html app/judges.json \
                  daily_run_summary.json oscar_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload daily summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary
          path: daily_run_summary.json