name: Deploy clerkship guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel older runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate map and site data (fast, no Wikipedia re-scrape)
        run: |
          # Enriched CSVs are committed; only rebuild map + site data.
          python make_map.py
          python export_site_data.py

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r app/* _site/
          # Also ship the interactive map as a secondary page.
          cp oscar_clerkship_map.html _site/map.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4